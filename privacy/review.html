<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>블러 영역 검토</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 13px system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 4px; }
  figure { margin: 0; position: relative; }
  canvas { width: 100%; display: block; }
  figcaption { position: absolute; top: 2px; left: 4px; background: #0008; padding: 0 4px; }
</style>
</head>
<body>
<p style="padding:4px 8px;margin:0">로컬 검토 전용 페이지입니다(공개 대상 아님). 빨간 상자는 번호판, 주황 상자는 사람, 노란 상자는 문구·전화번호입니다. 원본 프레임은 <code>data/frames/</code>에 있습니다.</p>
<div id="grid"></div>
<script>
const colors = { plate: "#ff2a2a", person: "#ff9b1a", face: "#ff9b1a", phone: "#ffe11a", text: "#ffe11a" };
const qs = new URLSearchParams(location.search);
const blur = qs.has("blur");
const top_ = Number(qs.get("top") || 1280);          // ?top=400 → 상단 400px만 표시
const [from, to] = (qs.get("range") || "1-24").split("-").map(Number);
document.getElementById("grid").style.gridTemplateColumns = `repeat(${qs.get("cols") || 6}, 1fr)`;
fetch("redact_boxes.json").then(r => r.json()).then(boxes => {
  for (let i = from; i <= to; i++) {
    const name = `frame_${String(i).padStart(3, "0")}.jpg`;
    const fig = document.createElement("figure");
    const cv = document.createElement("canvas");
    cv.width = 720; cv.height = top_;
    fig.append(cv, Object.assign(document.createElement("figcaption"), { textContent: name }));
    document.getElementById("grid").append(fig);
    const img = new Image();
    img.onload = () => {
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0);
      for (const b of boxes[name] || []) {
        const [x0, y0, x1, y1] = b.box;
        if (blur) { ctx.fillStyle = "#777"; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }
        ctx.strokeStyle = colors[b.type] || "#0f0"; ctx.lineWidth = 6;
        ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
      }
    };
    img.src = `../data/frames/${name}`;
  }
});
</script>
</body>
</html>
